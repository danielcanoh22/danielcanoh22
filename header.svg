<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    
    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" />

  <!-- Cyber Grid overlay -->
  <rect width="100%" height="100%" rx="16" fill="url(#grid)" />

  <!-- Abstract Design Elements / Glowing Blobs -->
  <circle cx="700" cy="80" r="100" fill="#a855f7" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="150" cy="180" r="80" fill="#6366f1" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="450" cy="40" r="60" fill="#ec4899" opacity="0.1" filter="url(#glow-heavy)" />

  <!-- Decorative diagonal lines -->
  <path d="M-50 200 L 200 -50" stroke="#6366f1" stroke-width="1" opacity="0.2" stroke-dasharray="5 5" />
  <path d="M600 290 L 850 40" stroke="#ec4899" stroke-width="1.5" opacity="0.2" />

  <!-- Decorative Code Dots (Top-Left) -->
  <circle cx="30" cy="30" r="6" fill="#ef4444" />
  <circle cx="50" cy="30" r="6" fill="#f59e0b" />
  <circle cx="70" cy="30" r="6" fill="#10b981" />

  <!-- Main Heading (Glow + Text) -->
  <text x="70" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#text-grad)" filter="url(#glow-subtle)">
    Hi, I'm Daniel!
  </text>
  
  <!-- Subtitle -->
  <text x="72" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#9ca3af" letter-spacing="1">
    Systems Engineer &amp; Software Developer
  </text>

  <!-- Animated-like Tag Elements on the right -->
  <g transform="translate(560, 105)" font-family="monospace" font-size="14" font-weight="bold">
    <!-- Code block UI element -->
    <rect x="0" y="0" width="170" height="40" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
    <text x="15" y="24" fill="#a855f7">&lt;</text>
    <text x="30" y="24" fill="#6366f1">FullStack</text>
    <text x="105" y="24" fill="#e5e7eb">Dev</text>
    <text x="140" y="24" fill="#a855f7">/&gt;</text>
  </g>

  <g transform="translate(610, 160)" font-family="monospace" font-size="12">
    <text x="0" y="0" fill="#10b981">● Active</text>
    <text x="70" y="0" fill="#9ca3af">learning: true</text>
  </g>
</svg>
